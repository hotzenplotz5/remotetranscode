name: Debian package

on:
  push:
    branches:
      - packaging/rellla-fixes
    paths:
      - 'debian/**'
      - 'packaging/**'
      - '.github/workflows/debian-package.yml'
      - 'meson.build'
      - 'meson_options.txt'
      - 'subprojects/**'
      - '*.cpp'
      - '*.h'
      - 'thrift-services/**'
      - 'static-content/**'
  workflow_dispatch:

jobs:
  noble-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential devscripts debhelper dpkg-dev lintian             cmake meson ninja-build pkg-config xz-utils             libssl-dev libcurl4-openssl-dev             libavutil-dev libavformat-dev libavfilter-dev libavcodec-dev

      - name: Prepare offline source tree
        run: |
          ./packaging/prepare-orig.sh 0.1+git20261117.49240d0
          test -d dist/remotetranscode-0.1+git20261117.49240d0/subprojects/thrift-0.24.0
          test -f dist/remotetranscode_0.1+git20261117.49240d0.orig.tar.xz

      - name: Build binary package without network downloads
        working-directory: dist/remotetranscode-0.1+git20261117.49240d0
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Verify package payload
        run: |
          deb="$(find dist -maxdepth 1 -name 'remotetranscode_*_amd64.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb -f "$deb" Package Version Architecture Depends
          dpkg-deb -c "$deb" | grep -F './usr/bin/remotrans'
          dpkg-deb -c "$deb" | grep -F './usr/share/remotetranscode/movie/'
          dpkg-deb -c "$deb" | grep -F './usr/lib/systemd/system/remotetranscode.service'

      - name: Lint package
        run: |
          lintian --no-fail-on-warnings dist/remotetranscode_*_amd64.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: remotetranscode-debian-amd64
          path: |
            dist/remotetranscode_*_amd64.deb
            dist/remotetranscode_*.buildinfo
            dist/remotetranscode_*.changes
          if-no-files-found: error
